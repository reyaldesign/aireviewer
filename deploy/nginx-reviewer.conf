# Nginx reverse-proxy config for the AI Image Reviewer, with HTTP basic auth
# so it's not publicly open once it's live on the internet.
#
# Install as (path varies by DreamHost VPS setup):
#   /etc/nginx/sites-available/reviewer.conf
#   sudo ln -s /etc/nginx/sites-available/reviewer.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Replace REPLACE_WITH_DOMAIN with your actual domain/subdomain
# (e.g. reviewer.yourdomain.com), pointed at the VPS via an A record first.
#
# Basic auth setup (run once, before reloading nginx):
#   sudo apt-get install -y apache2-utils
#   sudo htpasswd -c /etc/nginx/.htpasswd-reviewer yourusername
#   (enter a password when prompted; add more users by omitting -c)

server {
    listen 80;
    server_name REPLACE_WITH_DOMAIN;

    client_max_body_size 25M;  # allow reasonably large image uploads

    auth_basic "AI Image Reviewer";
    auth_basic_user_file /etc/nginx/.htpasswd-reviewer;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# After confirming this works over plain HTTP, get a free TLS cert with:
#   sudo certbot --nginx -d REPLACE_WITH_DOMAIN
# Certbot will rewrite this file to add a "listen 443 ssl" block and an
# HTTP -> HTTPS redirect automatically.

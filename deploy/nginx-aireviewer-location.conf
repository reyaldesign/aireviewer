# Paste inside the existing `server { server_name client.reyaldesign.com; ... }` block
# (the Reyal Proof site), ABOVE its `location / { ... }`. The app runs on 127.0.0.1:8000
# (see gunicorn-reviewer.service). The front-end uses relative URLs, so it works under /aireviewer/.
#
# Basic auth, once:  sudo htpasswd -c /etc/nginx/.htpasswd-reviewer <user>
# Then: sudo nginx -t && sudo systemctl reload nginx

location = /aireviewer { return 301 /aireviewer/; }

location /aireviewer/ {
    auth_basic "AI Image Reviewer";
    auth_basic_user_file /etc/nginx/.htpasswd-reviewer;

    client_max_body_size 25M;
    proxy_pass http://127.0.0.1:8000/;   # trailing slash strips the /aireviewer prefix
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;             # image reviews call Claude
}

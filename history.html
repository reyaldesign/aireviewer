<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>History · AI Review</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=Urbanist:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<div class="shell">
  <aside class="side" id="side"></aside>
  <main class="page">
    <div class="row between" style="align-items:flex-end">
      <div style="display:grid;gap:6px">
        <a class="crumb" href="./">AI Review /</a>
        <h1>History <sup id="total" class="muted" style="font:600 16px/1 var(--ui);letter-spacing:0"></sup></h1>
      </div>
      <label class="search"><span style="width:12px;height:12px;border:2px solid currentColor;border-radius:50%"></span><input id="q" type="search" placeholder="Search file names"></label>
    </div>
    <div class="row" style="flex-wrap:wrap">
      <div class="seg-pills" id="status"></div>
      <select class="pill-select" id="client"></select>
      <select class="pill-select" id="category"></select>
    </div>
    <div id="days" style="display:grid;gap:22px"></div>
    <div class="empty" id="empty" hidden>No reviews match.</div>
  </main>
</div>
<div id="drawer-root"></div>
<script src="js/common.js"></script>
<script src="js/detailView.js"></script>
<script src="js/history.js"></script>
</body>
</html>

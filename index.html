<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI Review</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=Urbanist:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<div class="shell">
  <aside class="side" id="side"></aside>
  <main class="review">
    <section class="left">
      <div class="row between">
        <h1>AI Review</h1>
        <div class="row">
          <a class="btn ghost" href="history.html">History</a>
          <button class="btn red" id="new-batch" type="button">+ New batch</button>
        </div>
      </div>

      <div class="card bar" id="bar">
        <span id="bar-tile"></span>
        <label class="tile-select"><span>Client</span><select id="client-select"></select></label>
        <label class="tile-select"><span>Category</span><select id="category-select" disabled></select></label>
        <div style="display:grid;gap:1px;min-width:0;flex:1">
          <span class="meta" id="bar-meta">Choose a client and category to load the criteria.</span>
        </div>
        <a class="link" id="edit-criteria" href="clients.html" hidden>Edit criteria</a>
      </div>

      <div class="row" style="flex-wrap:wrap">
        <div class="drop" id="drop">
          <span id="drop-text">Drop images or a folder</span>
          <button class="link" id="pick-files" type="button">Choose images</button>
          <button class="link" id="pick-folder" type="button">Choose folder</button>
        </div>
        <button class="btn red" id="review-btn" type="button" style="height:50px;padding:0 22px;font-size:14px" disabled>Review images</button>
      </div>
      <input type="file" id="file-input" accept="image/*" multiple hidden>
      <input type="file" id="folder-input" accept="image/*" webkitdirectory multiple hidden>
      <input type="file" id="fix-input" accept="image/*" hidden>

      <div class="tally" id="tally" hidden></div>
      <div class="grid" id="grid"></div>
      <div class="empty" id="empty">Add images above, then press Review. Each image is graded against the client's criteria.</div>
    </section>
    <aside class="detail" id="detail"></aside>
  </main>
</div>
<script src="js/common.js"></script>
<script src="js/reviewEngine.js"></script>
<script src="js/detailView.js"></script>
<script src="js/app.js"></script>
</body>
</html>
